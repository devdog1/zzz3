# Global configuration
include "/etc/bird/dynamic/global.conf";

log syslog all;
debug protocols all;

# router id is now handled in global.conf

protocol device {
    scan time 10;
}

protocol direct {
    disabled;
}

protocol kernel kernel4 {
    ipv4 {
        export all;
        import none;
    };
}

protocol kernel kernel6 {
    ipv6 {
        export all;
        import none;
    };
}

protocol static blackhole_v4 {
    ipv4;
    include "/etc/bird/dynamic/blackholes_v4.conf";
}

protocol static blackhole_v6 {
    ipv6;
    include "/etc/bird/dynamic/blackholes_v6.conf";
}

# Export filter for blackholes
filter export_blackhole {
    if (net.len = 32 || net.len = 128) then {
        bgp_community.add((LOCAL_AS, 666));
        accept;
    }
    reject;
}

# Template for Route Reflectors
template bgp rr_clients {
    local as LOCAL_AS;
    multihop;
    ipv4 {
        import none;
        export filter export_blackhole;
    };
    ipv6 {
        import none;
        export filter export_blackhole;
    };
}

# Dynamic peers
include "/etc/bird/dynamic/peers.conf";
