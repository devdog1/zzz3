log syslog all;

router id 1.1.1.1; # Replace with actual router ID

protocol device {}

protocol kernel {
    ipv4 {
        export all;
    };
}

protocol kernel {
    ipv6 {
        export all;
    };
}

# Filter to only allow /32 and /128
filter blackhole_filter {
    if (net.type = NET_IP4 && net.len = 32) || (net.type = NET_IP6 && net.len = 128) then {
        accept;
    }
    reject;
}

# Template for BGP peers (Route Reflectors)
template bgp rr_clients {
    local as 65000; # Replace with actual AS
    neighbor as 65000;

    ipv4 {
        import none; # Don't import routes
        export filter blackhole_filter;
    };

    ipv6 {
        import none; # Don't import routes
        export filter blackhole_filter;
    };
}

# Static protocol for IPv4 blackholes
protocol static dynamic_blackholes_v4 {
    ipv4;
    include "/etc/bird/dynamic/blackholes_v4.conf";
}

# Static protocol for IPv6 blackholes
protocol static dynamic_blackholes_v6 {
    ipv6;
    include "/etc/bird/dynamic/blackholes_v6.conf";
}
