log syslog all;

router id 1.1.1.1; # Replace with actual router ID

protocol device {}

protocol kernel kernel4 {
    ipv4 {
        import none; # Don't import from kernel
        export all;
    };
}

protocol kernel kernel6 {
    ipv6 {
        import none; # Don't import from kernel
        export all;
    };
}

# Static protocol for IPv4 blackholes
protocol static dynamic_blackholes_v4 {
    ipv4;
    include "/etc/bird/dynamic/blackholes_v4.conf";
}

# Static protocol for IPv6 blackholes
protocol static dynamic_blackholes_v6 {
    ipv6;
    include "/etc/bird/dynamic/blackholes_v6.conf";
}

# Template for BGP peers (Route Reflectors)
template bgp rr_clients {
    local as 65000;

    ipv4 {
        import none;
        export filter {
            if (net.type = NET_IP4 && net.len = 32) then {
                bgp_community.add((65000, 666));
                accept;
            }
            reject;
        };
    };

    ipv6 {
        import none;
        export filter {
            if (net.type = NET_IP6 && net.len = 128) then {
                bgp_community.add((65000, 666));
                accept;
            }
            reject;
        };
    };
}

# Include dynamic BGP peers
include "/etc/bird/dynamic/peers.conf";
