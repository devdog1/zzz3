/*
 * BGP Blackhole Configuration
 * Generated from Web GUI
 */

# Dynamic global settings - paths can stay relative to /etc/bird/ if we link correctly
include "/etc/bird/dynamic/global.conf";

filter Out {
    if(net ~ [0.0.0.0/32-]) then reject;
    if(net ~ [1.1.1.0/24+]) then reject;
    if(net ~ [1.1.2.0/24+]) then reject;
    if(net ~ [1.1.3.0/24+]) then reject;

    if (net.len = 32 || net.len = 128) then {
        bgp_community.empty;
        bgp_community.add((LOCAL_AS, 666));
        accept;
    }

    reject;
}

filter denyAll {
    reject;
}

protocol device {
    scan time 10;
}

protocol kernel kernel4 {
    ipv4 {
        export all;
        import none;
    };
}

protocol kernel kernel6 {
    ipv6 {
        export all;
        import none;
    };
}

# Static routes from the database
protocol static blackhole_v4 {
    ipv4;
    include "/etc/bird/bird_static.conf";
}

protocol static blackhole_v6 {
    ipv6;
    include "/etc/bird/bird_static_v6.conf";
}

# Dynamic BGP peers
include "/etc/bird/dynamic/peers.conf";
